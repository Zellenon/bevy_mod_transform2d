[package]
name = "bevy_mod_transform2d"
description = "A 2D Transform component for The Bevy game-engine."
version = "0.5.0"
edition = "2021"

repository = "https://github.com/zellenon/bevy_mod_transform2d"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "gamedev"]
categories = ["game-development"]

[features]
default = ["bevy_render"]
bevy_render = ["bevy/bevy_render"]
rapier = ["dep:bevy_rapier2d"]

[dependencies]
bevy = { version = "0.14", default-features = false }
bevy_rapier2d = { version = "0.27", default-features = false, optional = true }

[[example]]
name = "rapier2d"
required-features = ["bevy_rapier2d"]

[dev-dependencies]
bevy = "0.14"
bevy_rapier2d = { version = "0.27" }
